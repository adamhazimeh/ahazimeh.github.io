<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" role="img" aria-labelledby="title description">
  <title id="title">From a document image to editable shapes</title>
  <desc id="description">The same small bar chart is shown first as an image and then as vector shapes with editing handles.</desc>
  <style>text { font-weight: 500; } [stroke] { stroke-width: 1.5; } path[marker-end] { stroke-width: 1.8; }</style>
  <rect width="500" height="340" fill="#edf1f8"/>
  <rect x="20" y="20" width="460" height="300" fill="none" stroke="#b1bfd5" stroke-dasharray="2 5"/>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#244fa9" stroke-width="1.25"/></marker></defs>

  <rect x="43" y="66" width="157" height="202" rx="4" fill="#ffffff" stroke="#6e83a6"/>
  <rect x="300" y="66" width="157" height="202" rx="4" fill="#ffffff" stroke="#6e83a6"/>
  <rect x="64" y="88" width="104" height="6" fill="#7188aa"/><rect x="64" y="103" width="78" height="4" fill="#8295ae"/>
  <path d="M67 229V128M67 229H178" fill="none" stroke="#506c91"/>
  <rect x="81" y="177" width="18" height="51" fill="#87a2c9"/><rect x="111" y="151" width="18" height="77" fill="#5d82b2"/><rect x="141" y="133" width="18" height="95" fill="#376398"/>
  <path d="M214 166H285" fill="none" stroke="#244fa9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="321" y="88" width="104" height="6" fill="#6486b5"/><rect x="321" y="103" width="78" height="4" fill="#879fc3"/>
  <path d="M324 229V128M324 229H435" fill="none" stroke="#244fa9"/>
  <g stroke="#244fa9" fill="#bed0ed"><rect x="338" y="177" width="18" height="51"/><rect x="368" y="151" width="18" height="77"/><rect x="398" y="133" width="18" height="95"/></g>
  <g fill="#ffffff" stroke="#244fa9"><rect x="336" y="175" width="4" height="4"/><rect x="354" y="226" width="4" height="4"/><rect x="366" y="149" width="4" height="4"/><rect x="384" y="226" width="4" height="4"/><rect x="396" y="131" width="4" height="4"/><rect x="414" y="226" width="4" height="4"/></g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#243752"><text x="75" y="291">Document image</text><text x="337" y="291">Editable SVG</text></g>

</svg>
