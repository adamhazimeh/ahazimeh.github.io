  <title id="title">Studying adversarial behavior in language models</title>
  <desc id="description">Standard and adversarial inputs enter an LLM. Weight changes affect the model, and its internal states are inspected for unusual behavior. A conceptual illustration of jailbreak detection, backdoors, abliteration, and misalignment research.</desc>
